<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Conference">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191411"/>
      <stop offset="100%" stop-color="#3a2b23"/>
    </linearGradient>
    <radialGradient id="r" cx="30%" cy="26%" r="72%">
      <stop offset="0%" stop-color="#D2B36B" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#D2B36B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="34" stroke="#D2B36B" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#g)"/>
  <rect width="1200" height="900" fill="url(#r)"/>
  <rect width="1200" height="900" fill="url(#p)"/>
  <rect x="60" y="45" width="1080" height="810"
        fill="none" stroke="#D2B36B" stroke-opacity=".28" stroke-width="1"/>
  <g transform="translate(600 450)" text-anchor="middle">
    <text y="-40" font-family="Cormorant Garamond, Georgia, serif"
          font-size="135" fill="#D2B36B" fill-opacity=".85"
          letter-spacing="6">LGR</text>
    <text y="68" font-family="Jost, Helvetica, Arial, sans-serif"
          font-size="34" fill="rgba(255,255,255,.55)"
          letter-spacing="5">CONFERENCE</text>
  </g>
</svg>